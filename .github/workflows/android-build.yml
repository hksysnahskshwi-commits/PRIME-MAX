
package com.prime.max.loader;

import android.app.Activity;
import android.os.Bundle;
import android.view.View;
import android.graphics.Canvas;
import android.graphics.Paint;
import android.graphics.Color;
import android.graphics.RectF;
import android.widget.FrameLayout;
import android.widget.TextView;
import android.view.Gravity;

import java.util.Random;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        FrameLayout root = new FrameLayout(this);
        root.setBackgroundColor(Color.rgb(15, 20, 28));

        TrainingView training = new TrainingView();
        root.addView(training);

        TextView title = new TextView(this);
        title.setText("PRIME MAX | OFFLINE TRAINING");
        title.setTextColor(Color.WHITE);
        title.setTextSize(18);
        title.setGravity(Gravity.CENTER);
        title.setBackgroundColor(Color.rgb(30, 45, 60));

        FrameLayout.LayoutParams params =
            new FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT, 65,
                Gravity.TOP);

        root.addView(title, params);
        setContentView(root);
    }

    class TrainingView extends View {
        Paint paint = new Paint(3);
        Random random = new Random();

        float targetX = 400;
        float targetY = 500;

        TrainingView() {
            super(MainActivity.this);
            setFocusable(true);
        }

        @Override
        protected void onDraw(Canvas canvas) {
            super.onDraw(canvas);

            canvas.drawColor(Color.rgb(15, 20, 28));

            // Offline practice target
            paint.setColor(Color.GREEN);
            paint.setStyle(Paint.Style.STROKE);
            paint.setStrokeWidth(4);

            canvas.drawRect(
                targetX - 35, targetY - 60,
                targetX + 35, targetY + 60, paint);

            // ESP-style visualization
            paint.setColor(Color.YELLOW);
            paint.setTextSize(26);
            paint.setStyle(Paint.Style.FILL);
            canvas.drawText("TRAINING TARGET",
                targetX - 90, targetY - 75, paint);

            // Custom crosshair
            paint.setColor(Color.WHITE);
            paint.setStrokeWidth(3);

            float cx = getWidth() / 2f;
            float cy = getHeight() / 2f;

            canvas.drawLine(cx - 25, cy, cx + 25, cy, paint);
            canvas.drawLine(cx, cy - 25, cx, cy + 25, paint);

            paint.setTextSize(22);
            canvas.drawText("Tap screen to move target",
                30, getHeight() - 50, paint);
        }

        @Override
        public boolean onTouchEvent(android.view.MotionEvent event) {
            if (event.getAction() == android.view.MotionEvent.ACTION_DOWN) {
                targetX = event.getX();
                targetY = event.getY();
                invalidate();
                return true;
            }
            return true;
        }
    }
}
